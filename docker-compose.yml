services:
  db:
    image: postgres:18.7-alpine
    container_name: tsa_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: trucksigns-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsa_backend
    restart: unless-stopped
    env_file: .env
    networks:
      - tsa-network
    ports:
      - '8020:8020'
    environment:
      MODE: prod
      DEBUG_ENABLED: 'False'
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tsa-network:
    driver: bridge
